services:
  backend:
    build:
      context: ./backend
    container_name: usability_backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: usability_frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3001:3000"
    depends_on:
      - backend
